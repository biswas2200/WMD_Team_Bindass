server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: kodra-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kodra}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentThatIsVeryLongAndSecure12345}
  expiration: 86400000 # 24 hours

# GitHub OAuth Configuration
github:
  client:
    id: ${GITHUB_CLIENT_ID:dummy-id}
    secret: ${GITHUB_CLIENT_SECRET:dummy-secret}

# Gemini AI Configuration
gemini:
  apiKey: ${GEMINI_API_KEY:}
  baseUrl: https://generativelanguage.googleapis.com
  model: gemini-pro
  maxTokens: 2048
  temperature: 0.7

# CodeRabbit Configuration
coderabbit:
  api:
    url: https://api.coderabbit.ai
    key: ${CODERABBIT_API_KEY:dummy-coderabbit-key}



# Python AI Service Configuration
python:
  ai:
    service:
      url: ${PYTHON_AI_SERVICE_URL:http://localhost:5000}

logging:
  level:
    com.ruvaa: INFO
    org.springframework.security: INFO